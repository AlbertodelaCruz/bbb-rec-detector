<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detector de grabación BBB</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fafafa;
    }
    header {
      padding: 12px 14px;
      background: #0d1b2a;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #eee;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
    .dot.recording      { background: #2e7d32; }
    .dot.not-recording  { background: #c62828; }
    .dot.not-recordable { background: #ef6c00; }
    .dot.loading,
    .dot.unknown        { background: #9e9e9e; }
    .status-text { font-weight: 600; }
    .status-sub  { color: #666; font-weight: 400; font-size: 12px; }
    .opts { padding: 8px 14px 14px; }
    .opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
    }
    .opt label { cursor: pointer; }
    footer { padding: 10px 14px; color: #888; font-size: 11px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <header>🎥 Detector de grabación BBB</header>

  <div class="status">
    <span id="dot" class="dot loading"></span>
    <div>
      <div id="statusText" class="status-text">Comprobando…</div>
      <div id="statusSub" class="status-sub"></div>
    </div>
  </div>

  <div class="opts">
    <div class="opt">
      <label for="overlay">Aviso en pantalla</label>
      <input type="checkbox" id="overlay" />
    </div>
    <div class="opt">
      <label for="sound">Sonido de alerta</label>
      <input type="checkbox" id="sound" />
    </div>
    <div class="opt">
      <label for="notifications">Notificación del sistema</label>
      <input type="checkbox" id="notifications" />
    </div>
    <div class="opt">
      <label for="alertOnNotRecordable">Avisar si la sala no es grabable</label>
      <input type="checkbox" id="alertOnNotRecordable" />
    </div>
  </div>

  <footer>Detecta el indicador de grabación del cliente HTML5 de BigBlueButton.</footer>

  <script src="popup.js"></script>
</body>
</html>
